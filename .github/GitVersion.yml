workflow: GitHubFlow/v1
mode: ContinuousDelivery
next-version: 1.0.0
tag-prefix: '[vV]?'
branches:
  main:
    regex: ^master$|^main$
    mode: ContinuousDelivery
    label: ''
    increment: Patch
    is-main-branch: true
  feature:
    regex: ^features?[/-]|^feat[/-]
    mode: ContinuousDelivery
    label: 'alpha.{BranchName}'
    increment: Inherit
    source-branches: [main]
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    mode: ContinuousDelivery
    label: PullRequest
    increment: Inherit
    label-number-pattern: '[/-](?<number>\d+)'
    source-branches: [main, feature]
  hotfix:
    regex: ^hotfix(es)?[/-]
    mode: ContinuousDelivery
    label: beta
    increment: Inherit
    source-branches: [main]
ignore:
  sha: []
merge-message-formats: {}
